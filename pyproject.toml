[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demotive"
version = "0.1.0"
description = "Scripted, polished demo videos of your desktop app."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.1",
    "numpy",
    "imageio-ffmpeg",
]
